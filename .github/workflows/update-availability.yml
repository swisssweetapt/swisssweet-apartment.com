name: Update Avantio availability

"on":
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-availability:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Avantio calendar
        run: |
          mkdir -p data
          curl -L --fail --silent --show-error "https://calendar.avantio.pro/v1/3091b5a5-4d20-45b9-8faf-eb300bdbe4f8.ics" -o data/availability.ics

      - name: Commit updated calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/availability.ics
          git diff --cached --quiet || git commit -m "Update availability calendar"
          git push
